<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sneaker Store — интернет-магазин кроссовок с доставкой.">
    <title>Sneaker Store — магазин кроссовок</title>
    <script>
      // Применяем сохранённую тему до загрузки React и первого кадра.
      try {
        if (localStorage.getItem('sneaker-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch {
        // Если хранилище недоступно, используется светлая тема.
      }
    </script>
    <style>
      :root { color-scheme: light; --page: #f5f6f8; --ink: #20242a; background: var(--page); color: var(--ink); }
      :root[data-theme="dark"] { color-scheme: dark; --page: #17191d; --ink: #f0f1f3; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
